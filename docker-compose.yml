# The whole app: infrastructure (DESIGN.md §2), the vision services, the app server and the web app.
#
#   docker compose up -d --build      # then open http://localhost:5173
#
# To run only the infrastructure and start the app from source instead:
#
#   docker compose up -d postgres redis s3 vision vision-walls
#   export DATABASE_URL=postgres://vtt:vtt@localhost:5432/vtt
#   npm run prisma:migrate --workspace=@vtt/server   # apply prisma/migrations
#   DATABASE_URL=$DATABASE_URL \
#   REDIS_URL=redis://localhost:6379 \
#   S3_ENDPOINT=http://localhost:8333 npm run dev
#
# With none of those set the server falls back to the in-memory store, so `npm run dev`
# and CI still work with no containers running. Uploads go to this S3 store (SeaweedFS)
# whenever it is up, even without S3_ENDPOINT; local disk is the dev fallback when it is not.
name: cse416
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt
      POSTGRES_DB: vtt
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtt -d vtt"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - redisdata:/data
  # S3-compatible object storage (SeaweedFS). The S3 API is on 8333; the app creates its bucket.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data"]
    ports: ["${S3_PORT:-8333}:8333"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - s3data:/data
  vision:
    build: ./services/vision
    environment:
      PORT: 8000
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    ports: ["127.0.0.1:8000:8000"]
  # BullMQ consumer for wall detection (FR-GM-11, ADR 0029). Same image; no ports: it only
  # talks to Redis, taking jobs from the app server and returning walls and a preview.
  vision-walls:
    build: ./services/vision
    restart: unless-stopped
    command: ["python", "wall_worker.py"]
    environment:
      REDIS_URL: redis://redis:6379
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    depends_on: [redis]
  # The app server: applies the Prisma migrations, then serves the API and the sockets. No
  # `tsx watch`: the code is baked into the image, and watch mode would hang instead of exiting
  # (and being restarted) when a dependency is not ready.
  server:
    build: .
    # Dependencies can still be starting after their containers are "up" (SeaweedFS, Postgres),
    # and the server exits when one is not ready; retry until they are.
    restart: unless-stopped
    command: ["sh", "-c", "npm run prisma:migrate --workspace=@vtt/server && npm exec --workspace=@vtt/server -- tsx src/index.ts"]
    environment:
      DATABASE_URL: postgres://vtt:vtt@postgres:5432/vtt
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:8333
      # The vision service is its own container; the default 127.0.0.1:8000 is this container.
      VISION_URL: http://vision:8000
      # Dev only: signs in as t@gmail.com / password with no sign-up (never set in production).
      SEED_DEV_ACCOUNT: "1"
    ports: ["3001:3001"]
    # The server exits on start if one of these is not ready, so wait until each is healthy.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
  web:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "dev", "--workspace=@vtt/web"]
    environment:
      VTT_SERVER: http://server:3001
    ports: ["5173:5173"]
    depends_on: [server]
volumes:
  pgdata:
  redisdata:
  s3data:
