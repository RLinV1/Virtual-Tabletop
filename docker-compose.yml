# Local infrastructure (DESIGN.md §2).
#
#   docker compose up -d
#   export DATABASE_URL=postgres://vtt:vtt@localhost:5432/vtt
#   npm run prisma:migrate --workspace=@vtt/server   # apply prisma/migrations
#   DATABASE_URL=$DATABASE_URL \
#   REDIS_URL=redis://localhost:6379 \
#   MINIO_ENDPOINT=http://localhost:9000 npm run dev
#
# With none of those set the server falls back to the in-memory store, so `npm run dev`
# and CI still work with no containers running. Uploads go to this MinIO whenever it is
# up, even without MINIO_ENDPOINT; local disk is the dev fallback when it is not.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt
      POSTGRES_DB: vtt
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vtt
      MINIO_ROOT_PASSWORD: vttvttvtt
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
  vision:
    build: ./services/vision
    environment:
      PORT: 8000
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    ports: ["127.0.0.1:8000:8000"]
  # BullMQ consumer for wall detection (FR-GM-11, ADR 0025). Same image; no ports: it only
  # talks to Redis, taking jobs from the app server and returning walls and a preview.
  vision-walls:
    build: ./services/vision
    command: ["python", "wall_worker.py"]
    environment:
      REDIS_URL: redis://redis:6379
      OPENCV_IO_MAX_IMAGE_PIXELS: 40000000
    depends_on: [redis]
volumes:
  pgdata:
  redisdata:
  miniodata:
