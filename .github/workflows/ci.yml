name: CI

on:
  push:
    branches: [main, design]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@vtt/server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the server boots and answers /health
        run: |
          npm start &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "server healthy"
              curl -s http://localhost:3001/health
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in time"
          exit 1
